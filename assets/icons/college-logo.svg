<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="maroonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8A1530"/>
      <stop offset="55%" stop-color="#6B0F24"/>
      <stop offset="100%" stop-color="#4A0A19"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2C15A"/>
      <stop offset="50%" stop-color="#DDA034"/>
      <stop offset="100%" stop-color="#B97D1A"/>
    </linearGradient>
  </defs>

  <!-- Outer Gold & White Ring -->
  <circle cx="50" cy="50" r="47" fill="#FFFFFF" stroke="url(#maroonGrad)" stroke-width="3.5"/>
  <circle cx="50" cy="50" r="42.5" fill="none" stroke="url(#goldGrad)" stroke-width="1.5"/>

  <!-- Classic Academic Shield -->
  <path d="M50 13 L77 24 V50 C77 68.5 50 83 50 83 C50 83 23 68.5 23 50 V24 Z" fill="url(#maroonGrad)" stroke="url(#goldGrad)" stroke-width="1.8"/>

  <!-- Inner Shield Accent -->
  <path d="M50 18 L72 27.5 V49 C72 64.5 50 77.5 50 77.5 C50 77.5 28 64.5 28 49 V27.5 Z" fill="#4A0A19" opacity="0.35"/>

  <!-- Engineering Gear Emblem -->
  <g transform="translate(50, 46) scale(0.62)">
    <circle cx="0" cy="0" r="16" fill="url(#goldGrad)"/>
    <circle cx="0" cy="0" r="9" fill="#6B0F24"/>
    <rect x="-3" y="-22" width="6" height="7" rx="1.5" fill="url(#goldGrad)"/>
    <rect x="-3" y="15" width="6" height="7" rx="1.5" fill="url(#goldGrad)"/>
    <rect x="-22" y="-3" width="7" height="6" rx="1.5" fill="url(#goldGrad)"/>
    <rect x="15" y="-3" width="7" height="6" rx="1.5" fill="url(#goldGrad)"/>
    <rect x="-16" y="-16" width="6" height="6" rx="1.5" transform="rotate(45)" fill="url(#goldGrad)"/>
    <rect x="-16" y="-16" width="6" height="6" rx="1.5" transform="rotate(-45)" fill="url(#goldGrad)"/>
    <rect x="-16" y="-16" width="6" height="6" rx="1.5" transform="rotate(135)" fill="url(#goldGrad)"/>
    <rect x="-16" y="-16" width="6" height="6" rx="1.5" transform="rotate(225)" fill="url(#goldGrad)"/>
  </g>

  <!-- Torch Flame -->
  <path d="M50 28 C46 33 44.5 37 47 40 C49 42 52 42 53 39 C55.5 41.5 54.5 33 50 28 Z" fill="#F2C15A"/>

  <!-- Open Book of Knowledge -->
  <path d="M35 61 C42 59 48 62 50 65 C52 62 58 59 65 61 V70 C58 68 52 71 50 74 C48 71 42 68 35 70 Z" fill="#FFFFFF"/>
  <line x1="50" y1="65" x2="50" y2="74" stroke="#6B0F24" stroke-width="1.5"/>

  <!-- Gold Laurel Wreath -->
  <path d="M18 52 Q13 68 27 81" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M82 52 Q87 68 73 81" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- ESTD 1984 Ribbon -->
  <rect x="33" y="85" width="34" height="10" rx="3" fill="#6B0F24" stroke="url(#goldGrad)" stroke-width="1"/>
  <text x="50" y="92.2" fill="#F2C15A" font-size="6.5" font-family="Georgia, serif" font-weight="bold" text-anchor="middle" letter-spacing="0.4">ESTD 1984</text>
</svg>
