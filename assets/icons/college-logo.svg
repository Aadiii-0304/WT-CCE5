<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="crestGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#102A43"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#0B1D3A"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>
  <!-- Outer Ring -->
  <circle cx="50" cy="50" r="47" fill="#ffffff" stroke="url(#crestGrad)" stroke-width="4"/>
  <circle cx="50" cy="50" r="42" fill="none" stroke="#2563EB" stroke-width="1" stroke-dasharray="2,2"/>
  
  <!-- Shield Background -->
  <path d="M50 14 L76 25 V50 C76 68 50 82 50 82 C50 82 24 68 24 50 V25 Z" fill="url(#crestGrad)"/>
  
  <!-- Inner Shield Trim -->
  <path d="M50 18 L72 28 V49 C72 64 50 77 50 77 C50 77 28 64 28 49 V28 Z" fill="#0B1D3A" opacity="0.4"/>
  
  <!-- Gear Wheel (Engineering) -->
  <g transform="translate(50, 48) scale(0.65)">
    <circle cx="0" cy="0" r="16" fill="url(#goldGrad)" opacity="0.9"/>
    <circle cx="0" cy="0" r="9" fill="#102A43"/>
    <!-- Gear teeth -->
    <rect x="-3" y="-22" width="6" height="7" rx="1.5" fill="url(#goldGrad)"/>
    <rect x="-3" y="15" width="6" height="7" rx="1.5" fill="url(#goldGrad)"/>
    <rect x="-22" y="-3" width="7" height="6" rx="1.5" fill="url(#goldGrad)"/>
    <rect x="15" y="-3" width="7" height="6" rx="1.5" fill="url(#goldGrad)"/>
    <rect x="-16" y="-16" width="6" height="6" rx="1.5" transform="rotate(45)" fill="url(#goldGrad)"/>
    <rect x="-16" y="-16" width="6" height="6" rx="1.5" transform="rotate(-45)" fill="url(#goldGrad)"/>
    <rect x="-16" y="-16" width="6" height="6" rx="1.5" transform="rotate(135)" fill="url(#goldGrad)"/>
    <rect x="-16" y="-16" width="6" height="6" rx="1.5" transform="rotate(225)" fill="url(#goldGrad)"/>
  </g>
  
  <!-- Knowledge Torch Flame -->
  <path d="M50 31 C46 36 44 40 47 43 C49 45 52 45 53 42 C56 45 55 36 50 31 Z" fill="#F59E0B"/>
  <path d="M50 34 C48 37 47 39 49 41 C50 42 52 42 52 40 C54 42 53 37 50 34 Z" fill="#EF4444"/>

  <!-- Open Book of Wisdom -->
  <path d="M35 63 C42 61 48 64 50 67 C52 64 58 61 65 63 V72 C58 70 52 73 50 76 C48 73 42 70 35 72 Z" fill="#FFFFFF"/>
  <line x1="50" y1="67" x2="50" y2="76" stroke="#102A43" stroke-width="1.5"/>

  <!-- Laurel Leaves Wreath -->
  <path d="M20 54 Q15 68 28 80" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M80 54 Q85 68 72 80" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Year Estd Ribbon -->
  <rect x="36" y="86" width="28" height="9" rx="3" fill="#102A43"/>
  <text x="50" y="93" fill="#F59E0B" font-size="6.5" font-family="'Segoe UI', Arial, sans-serif" font-weight="bold" text-anchor="middle">ESTD 1984</text>
</svg>
